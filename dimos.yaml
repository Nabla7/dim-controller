title: Controller
spec-version: v1.4 # the dimos.yaml spec version this file follows
version: "0.2.0"
uses:
    "@dimos-gateway":
        # what's running (and its log dir, for recordings), then its Twist inputs, for the drive topic picker
        - GET /active
        - GET /active/modules
        - POST /active/modules/{id}/rpcs/{name}
        - GET /catalog/blueprints/{name}
        - GET /info
        # robots.json's robot types, for the auto robot type
        - GET /catalog/robots
    "@desktop-gateway":
        # recordings go to Desktop's shared folder; the recorder panel lists, downloads and deletes them there
        - GET /recordings
        - GET /recordings/{id}/file
        - DELETE /recordings/{id}
        # Desktop's default robot (ui.default_robot), for the auto robot type
        - GET /settings
        # dim-app's appInstalled (listApps): whether the Launcher / Recordings are there to point at
        - GET /info/apps
        # dim-app's notify (battery low), with the app's icon
        - POST /ui/notifications
        - GET /info/apps/{pkg}/icon
        # dim-app's getZenoh: where the zenoh-gateway and this app's namespace are
        - GET /management/gateways/zenoh
        # the backend's page events when it can't open its own zenoh session (Desktop's relay)
        - POST /ui/apps/{pkg}/frontend/{topic}
        # the 3D view's one-time "Try right-click" tip
        - POST /ui/narration
        # on a Steam Deck opened outside Steam (the backend's api/host says so): the banner offering to open dimOS in Steam
        - POST /ui/steam/open
    "@zenoh-gateway": ">=0.5 <0.6"
# Desktop's nix builds of this app pull from this cache (CI fills it)
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    openapi: 3.1.0
    info:
        title: Controller
        version: 3.0.0
        description: >-
            Controller: drive the running robot (keyboard / sticks, velocity commands, stop) while watching its live
            3D view (point clouds, costmap, pose, planned path, TF) and cameras; recording to mcap, location labels,
            live 3D annotations (boxes with labels every open page shows), and the view's settings (layers, styles,
            fixed frame, follow). Coordinates are meters in the world frame, +z up. GET api/status is the overview;
            GET api/view what the user sees.
        x-when: 'you need to drive a robot, watch it live in 3D, or record it'
    x-private:
        - api/pages/*
        - api/captures/*
        - api/drive/*
        - api/recorder/*
        - api/settings/*
        - api/annotations/*
        - api/labels/*
        - api/topics/*
        - api/events/*
    paths:
        /api/status:
            get:
                description: >-
                    The overview: whether it's recording (seconds, size, path, topics, log lines), the view settings
                    (robot type, fixed frame, follow), layers turned on or off, driving (the command being sent,
                    speeds and topic), annotations and location labels, and how many pages are open. Returns
                    {recording, recordingKeys, view, layersEnabled, rendering, drive, armed (always true), driving
                    (the command being sent, or null), annotations, labels, pages}.
                x-when: 'you want an overview: recording, driving, view, labels, boxes'
                x-dimos-role: context
        /api/view:
            get:
                description: >-
                    What the user sees: the rendered 3D view (with annotation labels) as an image, the 3D camera's
                    pose and intrinsics, the latest robot camera image (with a pixel grid) and its CameraInfo and
                    pose, the robot's pose, the annotations, and the fixed frame. 503 if no page is open to render
                    it.
                x-when: 'you need to see what the user sees, or where the robot is'
                x-dimos-role: view
        /api/camera:
            post:
                description: >-
                    Move the 3D camera in every open page: action=recenter (follow the robot again, or reframe it if
                    already following), topDown (straight down over the robot), or lookAt (target [x, y, z],
                    optional distance; stops following). Returns {ok, pages} (how many pages got it); 400 for an
                    unknown action or lookAt without a target.
                x-when: you want to point the user's 3D view at the robot or a place
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    action:
                                        description: recenter | topDown | lookAt
                                        type: string
                                    distance:
                                        description: 'lookAt: meters from the target'
                                        type: number
                                    target:
                                        description: 'lookAt: the point, world frame'
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                required:
                                    - action
                                type: object
        /api/settings:
            get:
                description: >-
                    Every page setting by key: lv.view {profile (the robot type picked: dog, humanoid, wheeled, arm,
                    drone; "" = auto), robot (the type in use, written by the page), fixedFrame ("" = auto), follow,
                    followFrame (the TF frame the camera follows; "" = the robot's), showStats, robotModel,
                    camerasIn3d (every camera drawn in the 3D view), viewCube (the 3D view's view cube)}; lv.arm
                    {linear, angular, jointSpeed} (arm jog speeds); lv.gamepad {deadZone, invertY}; lv.rendering.v2
                    {pointStyle, cubeShade}; lv.layers.enabled {<topic key>: on/off}; lv.layer.<type>.<topic key>
                    (that layer's style: colors, sizes, ...); lv.drive.<robot type> {linear, angular, vertical,
                    topics: [] = auto, else the output topics, one per entry, "/name" or "/name TwistStamped"};
                    lv.joy {enabled} (the raw gamepad, drive keys and thumb sticks as sensor_msgs/Joy on /joystick,
                    default on); lv.record.topics {<topic key>: record or not (default on)}; lv.record.options
                    {recordNew, compression, image_format, directory ("" = default), logs, rates {<topic key>: max
                    messages/s}}; lv.cameras (the camera panels). Returns an object of setting key -> its value.
                x-when: 'you need the current value of a view, drive or recorder setting'
            patch:
                description: >-
                    Change a page setting (merged into the key's object; a null field is removed); every open page
                    applies it at once. E.g. {key: "lv.layers.enabled", value:
                    {"dimos/lidar/sensor_msgs.PointCloud2": false}} hides a layer; {key: "lv.view", value: {follow:
                    false}}. Keys: see GET api/settings. Returns {key, value} (the key's whole value after the
                    merge); 400 for an unknown key or a value that isn't an object.
                x-when: 'you want to change layers, the view, drive speeds or topics'
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    key:
                                        description: 'e.g. lv.view, lv.layers.enabled, lv.layer.pointcloud.<topic key>'
                                        type: string
                                    value:
                                        description: the fields to set
                                        type: object
                                required:
                                    - key
                                    - value
                                type: object
        /api/recorder:
            get:
                description: >-
                    The recorder: whether it's recording (messages, bytes, dropped, skipped by a max rate, seconds,
                    path), the keys and log dirs being recorded, the files in the recordings folder, the folder (and
                    the default one, and Desktop's shared recordings folder) and its options (lv.record.options).
                    Returns {recording {active, path, messages, bytes, dropped, skipped, seconds}, keys, logs {dirs,
                    lines}, files [{name, path, bytes, seconds_old}], settings, directory, default_directory,
                    recordings_root, options}.
                x-when: 'you want to know if it''s recording, or list the recordings'
        /api/recorder/start:
            post:
                description: >-
                    Start recording to mcap. Without keys: every topic on the bus except the ones turned off in the
                    recorder (lv.record.topics), and topics that appear later join (unless recordNew is off); the
                    running dimos's jsonl logs go in too (unless logs is off). Each stream is kept to its max rate
                    (rates). Location labels are written into it. Returns the recording status {active, path,
                    messages, bytes, dropped, skipped, seconds}; 409 with the reason if it can't start (e.g. already
                    recording), 503 if the bus can't be reached.
                x-when: you need to start recording the robot's data to an mcap file
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    keys:
                                        description: 'dimos keys to record (dimos/<topic>/<pkg.Type>); default: as above'
                                        items:
                                            type: string
                                        type: array
                                    name:
                                        description: file name (default controller_<time>.mcap)
                                        type: string
                                type: object
        /api/recorder/stop:
            post:
                description: >-
                    Stop the recording and close the file (it shows in Desktop's recordings), once the files it
                    asked for (the robot's meshes, a sim's world) are in it or given up on. Returns the final status
                    {active, path, messages, bytes, dropped, skipped, seconds}; 409 if not recording.
                x-when: you want to stop and save the running recording
        /api/recorder/add:
            post:
                description: >-
                    Add keys to the running recording. Returns {added} (how many of the keys were new); 409 if not
                    recording.
                x-when: you want more topics in the recording that's already running
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    keys:
                                        description: dimos keys to add (dimos/<topic>/<pkg.Type>)
                                        items:
                                            type: string
                                        type: array
                                required:
                                    - keys
                                type: object
        /api/recorder/logs:
            post:
                description: >-
                    Add dimos log dirs to the running recording (each run's log dir, or logs roots whose run dirs
                    are followed). Returns {dirs} (the log dirs now recorded); 409 if not recording.
                x-when: you want dimos logs added to the running recording
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    log_dirs:
                                        description: a run's log dir each; its jsonl logs are tailed into the recording
                                        items:
                                            type: string
                                        type: array
                                    log_roots:
                                        description: logs roots; each run dir in them is followed
                                        items:
                                            type: string
                                        type: array
                                type: object
        /api/recorder/settings:
            put:
                description: >-
                    Recording options, saved (lv.record.options): image_format (raw | png | jpegxl | webp | jpeg),
                    compression (none | lz4 | zstd) and directory ("" = the default) not while recording; recordNew,
                    logs and rates (a stream's max messages per second, 0 = every message) any time. Only the fields
                    given change. Returns the recorder status (as GET api/recorder); 409 for a format or folder
                    change while recording, 400 for a bad value.
                x-when: 'you want to change the recording format, folder or topic rates'
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    compression:
                                        description: none | lz4 | zstd
                                        type: string
                                    directory:
                                        description: >-
                                            where recordings go; "" = the default (Desktop's shared recordings
                                            folder)
                                        type: string
                                    image_format:
                                        description: raw | png | jpegxl | webp | jpeg
                                        type: string
                                    logs:
                                        description: record the running dimos's jsonl logs
                                        type: boolean
                                    rates:
                                        description: topic key -> max messages per second (0 or null = every message)
                                        type: object
                                    recordNew:
                                        description: topics that appear mid-recording join it
                                        type: boolean
                                type: object
        /api/recorder/streams:
            get:
                description: >-
                    Each stream on the bus, biggest first: key, topic, type, bytesPerSecond and messagesPerSecond
                    (measured live; the meter listens while this is asked for and stops 15 s after), whether it's
                    recorded, and its maxRate. Returns {streams [...], seconds} (seconds = how long the meter has
                    listened).
                x-when: you need to know which topics are on the bus and how heavy they are
        '/api/recorder/files/{name}':
            delete:
                description: >-
                    Delete a recording from the recordings folder (not the running one). Returns {ok, removed}; 409
                    if it is the running recording, 404 if there is no such file.
                x-when: you want to delete a finished recording
                parameters:
                    -
                        name: name
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the file name, as GET api/recorder lists it under files'
            get:
                description: >-
                    Download a recording from the recordings folder. Returns the file's bytes
                    (application/octet-stream, as an attachment); 404 if there is no such file.
                x-when: you want to download a finished recording
                parameters:
                    -
                        name: name
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the file name, as GET api/recorder lists it under files'
        /api/labels:
            get:
                description: >-
                    Location labels pinned in the map (right-click in the 3D view): id, label, frame_id, position,
                    orientation, created (ns). Returns {labels [...]}.
                x-when: you want the named places pinned on the map
            post:
                description: >-
                    Pin a text label at a point (the viewer's fixed frame, usually world); if a recording is running
                    it is written into it on /labels. Returns {label (with its new id), recorded (whether it went
                    into a running recording)}; 400 if a field is missing.
                x-when: you want to name a place on the map
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    frame_id:
                                        description: 'the frame of position, e.g. world'
                                        type: string
                                    label:
                                        description: the text shown at the point
                                        type: string
                                    position:
                                        description: '[x, y, z] meters in frame_id'
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                required:
                                    - frame_id
                                    - label
                                    - position
                                type: object
        '/api/labels/{id}':
            delete:
                summary: 'Remove a location label. Returns {ok, removed}; 404 if there is no such label.'
                x-when: you want to remove a named place from the map
                parameters:
                    -
                        name: id
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the label''s id, from GET api/labels'
        /api/annotations:
            delete:
                summary: 'Remove every annotation. Returns {removed} (how many were removed).'
                x-when: you want to clear every 3D box from the view
            get:
                summary: 'The live annotations (id, label, center, size, yaw, frame, note). Returns {annotations [...]}.'
                x-when: you want the labeled 3D boxes shown in the view
            post:
                description: >-
                    Add a live 3D box annotation with a label; every open page shows it immediately. Returns the
                    annotation as stored (with its id); 400 for a bad field.
                x-when: you want to mark something in the 3D view with a labeled box
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    center:
                                        description: 'box center [x, y, z], meters in frame'
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    color:
                                        description: CSS color
                                        type: string
                                    frame:
                                        description: TF frame of center (default world)
                                        type: string
                                    id:
                                        description: optional id (default box-<n>); use it to update or delete
                                        type: string
                                    label:
                                        description: shown above the box
                                        type: string
                                    note:
                                        description: 'a second line under the label, e.g. "1.76 m tall"'
                                        type: string
                                    size:
                                        description: 'full extents [dx, dy, dz], meters'
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    yaw:
                                        description: radians about +z (default 0)
                                        type: number
                                type: object
        '/api/annotations/{id}':
            delete:
                summary: 'Remove an annotation by id. Returns {ok, removed}; 404 if there is no such id.'
                x-when: you want to remove one 3D box from the view
                parameters:
                    -
                        name: id
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the annotation''s id, from GET api/annotations'
            patch:
                description: >-
                    Change an annotation: label, note, center, size, yaw, color, or newId (to rename it). Only the
                    fields given change. Returns the updated annotation; 404 if there is no such id.
                x-when: 'you want to move, resize, relabel or rename a 3D box'
                parameters:
                    -
                        name: id
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the annotation''s id (in the path), from GET api/annotations'
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    center:
                                        description: new center
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    color:
                                        description: CSS color
                                        type: string
                                    label:
                                        description: new text shown above the box
                                        type: string
                                    newId:
                                        description: rename to this id
                                        type: string
                                    note:
                                        description: new second line under the label
                                        type: string
                                    size:
                                        description: new size
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    yaw:
                                        description: 'new rotation, radians about +z'
                                        type: number
                                type: object
        /api/locate:
            post:
                description: >-
                    Find an object in 3D from a box around it in the robot camera image (pixel coordinates of the
                    image GET api/view returns): uses the lidar points inside that box (else where the box's bottom
                    meets the floor) and returns its 3D box and height. add=true also adds it as an annotation.
                    Returns {method (lidar, or floor contact), points, depth, height (meters; null if a
                    floor-contact box is cut off at the image top), ground, box {center, size, yaw, frame}, note},
                    or with add=true {located, annotation}; 400 for a bad bbox, 422 with the reason if it can't (no
                    page open, no CameraInfo, no TF, ...).
                x-when: you need an object's 3D position or height from the camera image
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    add:
                                        description: also add the found box as an annotation
                                        type: boolean
                                    bbox:
                                        description: '[x1, y1, x2, y2] pixels in the camera image'
                                        items:
                                            type: number
                                        maxItems: 4
                                        minItems: 4
                                        type: array
                                    id:
                                        description: 'with add=true: the annotation''s id (default box-<n>)'
                                        type: string
                                    label:
                                        description: 'with add=true: the annotation''s label'
                                        type: string
                                required:
                                    - bbox
                                type: object
        /api/drive/arm:
            post:
                description: >-
                    No-op, kept for older callers: driving needs no arming (always armed). Use api/drive/stop to
                    stop. Returns {armed: true, note}.
                x-when: an older script arms driving first (never needed now)
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    armed:
                                        description: ignored
                                        type: boolean
                                    source:
                                        description: ignored
                                        type: string
                                type: object
        /api/drive:
            post:
                description: >-
                    Drive the robot: publish a Twist (linear [x, y, z] m/s, angular [x, y, z] rad/s, each within ±5)
                    at 10 Hz for seconds (default 1, at most 10), then a second of zeros. No arming needed. topic:
                    default the drive panel's, else the cmd_vel on the bus. dryRun=true only says what it would
                    send. A new command or a stop replaces a running one; every open page shows it. Returns {key,
                    linear, angular, seconds, hz, messages (how many it sends), dryRun, source}; 400 for a speed,
                    duration or topic out of range.
                x-when: you need to drive or turn the robot
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    angular:
                                        description: rad/s (z = turn left)
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    dryRun:
                                        description: 'send nothing, say what would be sent'
                                        type: boolean
                                    linear:
                                        description: 'm/s, robot frame (x forward, y left)'
                                        items:
                                            type: number
                                        maxItems: 3
                                        minItems: 3
                                        type: array
                                    seconds:
                                        description: 'default 1, at most 10'
                                        type: number
                                    source:
                                        description: 'who is driving, shown on the page (default agent)'
                                        type: string
                                    topic:
                                        description: e.g. /cmd_vel
                                        type: string
                                type: object
        /api/drive/stop:
            post:
                description: >-
                    Stop driving: cancels a running drive command and sends a second of zeros. Returns what it
                    sends, as api/drive does (a zero Twist); 400 for a bad topic.
                x-when: you need the robot to stop moving
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    dryRun:
                                        description: 'send nothing, say what would be sent'
                                        type: boolean
                                    topic:
                                        description: default as for api/drive
                                        type: string
                                type: object
        /api/manipulation:
            get:
                description: >-
                    Discover the selected Desktop run and its planner instance. Returns binding {run_id, module,
                    session}, state, planning groups, target, plan and advertised spatial views. Include this exact
                    binding in every planning action; a changed session invalidates targets and plans.
                x-when: 'you need the arm planner''s state, target, groups or last plan'
        /api/manipulation/target:
            post:
                description: >-
                    Set the target every open page shows as the ghost arm (it moves nothing): groups (the planning
                    groups selected, default [manipulator]) with joints {name: radians} and/or poses {group:
                    {position [x, y, z], orientation [x, y, z, w], frame (default world)}} (or one pose for the
                    first group), source joints | cartesian (which was edited); or preset current | init | home
                    (that preset's joints for the groups). clear=true removes the target.
                x-when: you want to set or clear where the arm should go (moves nothing)
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                    clear:
                                        description: remove the target
                                        type: boolean
                                    groups:
                                        description: planning group ids
                                        type: array
                                    joints:
                                        description: joint name -> radians
                                        type: object
                                    pose:
                                        description: the first group's pose
                                        type: object
                                    poses:
                                        description: 'group -> {position, orientation, frame}'
                                        type: object
                                    preset:
                                        description: current | init | home
                                        type: string
                                    source:
                                        description: joints | cartesian
                                        type: string
                                required:
                                    - binding
                                type: object
        /api/manipulation/plan:
            post:
                description: >-
                    Plan in the inspected planner. Joint mode follows the supplied joints or pose targets; Cartesian
                    mode requests a straight TCP path. Geometry and collision coverage are those supplied by the
                    robot model. A successful plan is kept for Preview and Execute; both require its plan_id. speed:
                    0.05-1.
                x-when: you want a collision-checked plan to the arm target
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                    groups:
                                        type: array
                                    joints:
                                        type: object
                                    mode:
                                        description: joint | cartesian
                                        type: string
                                    poses:
                                        type: object
                                    speed:
                                        description: 0.05-1
                                        type: number
                                required:
                                    - binding
                                type: object
        /api/manipulation/preview:
            post:
                summary: Play the kept plan on the ghost arm in every open page (the real arm doesn't move).
                x-when: you want to show the planned arm motion without moving the arm
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                    plan_id:
                                        description: ID of the plan inspected by this caller
                                        type: string
                                required:
                                    - binding
                                    - plan_id
                                type: object
        /api/manipulation/execute:
            post:
                summary: Run the kept plan on the arm.
                x-when: you want the arm to run the kept plan
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                    plan_id:
                                        description: ID of the plan inspected by this caller
                                        type: string
                                required:
                                    - binding
                                    - plan_id
                                type: object
        /api/manipulation/cancel:
            post:
                summary: Stop planning or the running trajectory.
                x-when: you need the arm's planning or motion stopped
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                required:
                                    - binding
                                type: object
        /api/manipulation/clear:
            post:
                summary: Discard the kept plan.
                x-when: you want the kept arm plan discarded
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                required:
                                    - binding
                                type: object
        /api/manipulation/obstacles:
            get:
                description: >-
                    Obstacle name to pose mapping from the selected planner. Requires binding as JSON in the query
                    string.
                x-when: you need the arm planner's obstacles
                parameters:
                    -
                        name: binding
                        in: query
                        required: true
                        schema:
                            type: string
                        description: JSON binding from GET api/manipulation
        /api/manipulation/evaluate:
            post:
                description: >-
                    Check the target through the selected planner operator: limits and configured collision
                    geometry, and IK for pose targets. Returns success, collision_free, status, message, joints and
                    poses. A model without collision geometry cannot establish collision safety.
                x-when: you want to check an arm target before planning
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    binding:
                                        description: Exact binding from GET api/manipulation
                                        type: object
                                    groups:
                                        type: array
                                    joints:
                                        type: object
                                    poses:
                                        type: object
                                    source:
                                        description: joints | cartesian
                                        type: string
                                required:
                                    - binding
                                type: object
        /api/manipulation/scene:
            get:
                description: >-
                    Obstacle poses from the selected planner, represented as markers. Requires binding as JSON in
                    the query string. This adapter does not provide grasp proposals or obstacle mesh geometry.
                x-when: you need the arm planning scene's shapes and grasp proposals
                parameters:
                    -
                        name: binding
                        in: query
                        required: true
                        schema:
                            type: string
                        description: JSON binding from GET api/manipulation
        /api/manipulation/hook:
            get:
                description: >-
                    Legacy compatibility status. This Controller uses the engine operator RPCs instead of installing
                    a process hook.
                x-when: you need to know whether the controller's planner hook is loaded or installed
        /api/manipulation/hook/install:
            post:
                description: >-
                    Retired endpoint. Returns 410: use an engine with operator RPCs; no environment or running
                    process is modified.
                x-when: you want the controller's planner hook installed into the running blueprint
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    uninstall:
                                        description: ''
                                        type: boolean
                                    venv:
                                        description: 'a venv or its python (default: every running dimos run''s)'
                                        type: string
                                type: object
        /api/manipulation/poses:
            get:
                description: >-
                    The arm poses saved for a robot model (robot: its URDF name), from
                    ~/.dimos/app_data/manip_data/<robot>/poses.yaml: poses [{name, color, target}] (target as
                    api/manipulation/target takes it; setting it moves nothing).
                x-when: you need the arm poses saved for a robot
                parameters:
                    -
                        name: robot
                        in: query
                        required: true
                        schema:
                            type: string
                        description: 'the URDF''s name, e.g. r1pro'
            put:
                description: >-
                    Replace the arm poses saved for a robot model (the whole list, in order); every open page shows
                    them.
                x-when: you want to change the arm poses saved for a robot
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    poses:
                                        description: '[{name, color (CSS, optional), target {groups, joints, poses, source}}]'
                                        type: array
                                    robot:
                                        description: the URDF's name
                                        type: string
                                required:
                                    - poses
                                    - robot
                                type: object
        /api/manipulation/options:
            patch:
                description: >-
                    The arm 3D view's planner options (lv.manip), applied in every open page: mode (joint |
                    cartesian: what the gizmo and sliders set), speed (next plan's speed scale 0.05-1), display
                    (visual | collision | both: the arm's geometry), obstacles (draw the planning scene's
                    obstacles), grasps (draw the grasp proposals), grid (the ground grid), interact (the 3D arm and
                    gizmo are shown).
                x-when: you want to change the arm view's planner options
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    display:
                                        description: visual | collision | both
                                        type: string
                                    grasps:
                                        description: ''
                                        type: boolean
                                    grid:
                                        description: ''
                                        type: boolean
                                    interact:
                                        description: ''
                                        type: boolean
                                    mode:
                                        description: joint | cartesian
                                        type: string
                                    obstacles:
                                        description: ''
                                        type: boolean
                                    speed:
                                        description: 0.05-1
                                        type: number
                                type: object
        /api/host:
            get:
                description: >-
                    The machine this runs on (the robot's computer): its CPU load, sampled every few seconds in the
                    background. Returns {cpu: {busyPercent (all cores, over the last sample; Linux and macOS),
                    cores, sampledAt (unix ms), everySecs} or null before the first sample, steamDeck (Valve's
                    Jupiter or Galileo board), steamOs (/etc/os-release says SteamOS)}.
                x-when: you need to know whether the robot's computer is overloaded
        /api/action_buttons:
            get:
                description: >-
                    This machine's action buttons (the action bar on every open page): each a label and the shell
                    command a click runs. Returns {buttons: [{id, label, command}]}.
                x-when: you need the buttons on the controller's action bar
            post:
                description: >-
                    Adds a button to the action bar on every open page; a click runs `command` with sh -c from the
                    home directory of the machine this runs on (the robot's computer when Desktop runs there). Kept
                    across restarts. Returns {button: {id, label, command}, buttons}.
                x-when: you want to give the user a one-click button for a shell command on this machine
                requestBody:
                    content:
                        application/json:
                            schema:
                                properties:
                                    command:
                                        description: the shell command a click runs (sh -c)
                                        type: string
                                    label:
                                        description: 'the button''s text, a few words'
                                        type: string
                                required:
                                    - command
                                    - label
                                type: object
        '/api/action_buttons/{id}':
            delete:
                summary: 'Removes a button for good. Returns {ok, removed, buttons}; 404 if there is no such id.'
                x-when: you want to remove an action button
                parameters:
                    -
                        name: id
                        in: path
                        required: true
                        schema:
                            type: string
                        description: 'the button''s id (in the path), from GET api/action_buttons'
        '/api/action_buttons/{id}/run':
            post:
                description: >-
                    Runs the button's command (sh -c, from the home directory; stopped after 120 s) and waits for
                    it. Returns {id, label, exitCode, ok, stdout, stderr (each its last 8 KB), ms}; 404 if there is
                    no such id.
                x-when: you want to run an action button's command
                parameters:
                    -
                        name: id
                        in: path
                        required: true
                        schema:
                            type: string
                        description: the button's id (in the path)
        /api/manipulation/model:
            get:
                summary: Loaded robot description from the inspected planner. Pass binding as JSON in the query string.
                x-when: you need the selected planner's robot model
                parameters:
                    -
                        name: binding
                        in: query
                        required: true
                        schema:
                            type: string
                        description: JSON binding from GET api/manipulation
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
