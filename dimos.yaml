title: Controller
spec-version: v1.0 # the dimos.yaml spec version this file follows
uses:
    "@dimos-gateway":
        # the running blueprint's Twist inputs, for the drive topic picker
        - GET /runs
        - GET /catalog/blueprints/{name}
        - GET /info
    "@desktop-gateway":
        # recordings go to Desktop's shared folder; the recorder panel lists, downloads and deletes them there
        - GET /recordings
        - GET /recordings/{id}/file
        - DELETE /recordings/{id}
        - GET /api/launcher/robots
        - GET /api/apps
        - POST /api/notifications
        # the 3D view's one-time "Try right-click" tip
        - POST /api/desktop/narration
        # on a Steam Deck opened outside Steam: the banner offering to open dimOS in Steam (Desktop >= 0.2.119; older 404s)
        - GET /api/steam-deck
        - POST /api/steam-deck/open
    "@zenoh-gateway": ">=0.5 <0.6"
# Desktop's nix builds of this app pull from this cache (CI fills it)
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    # what its server answers only its own pages (its endpoints: below are the public API)
    private:
        - api/pages/*
        - api/captures/*
        - api/drive/*
        - api/recorder/*
        - api/settings/*
        - api/annotations/*
        - api/labels/*
        - api/topics/*
        - api/events/*
    when: 'you need to drive a robot, watch it live in 3D, or record it'
    description: >-
        Controller: drive the running robot (keyboard / sticks, velocity commands, stop) while watching its live 3D view
        (point clouds, costmap, pose, planned path, TF) and cameras; recording to mcap, location labels, live 3D
        annotations (boxes with labels every open page shows), and the view's settings (layers, styles, fixed frame,
        follow). Coordinates are meters in the world frame, +z up. GET api/status is the overview; GET api/view what the
        user sees.
    endpoints:
        -
            method: GET
            path: api/status
            when: 'you want an overview: recording, driving, view, labels, boxes'
            description: >-
                The overview: whether it's recording (seconds, size, path, topics, log lines), the view settings (robot
                type, fixed frame, follow), layers turned on or off, driving (the command being sent, speeds and topic),
                annotations and location labels, and how many pages are open. Returns {recording, recordingKeys, view,
                layersEnabled, rendering, drive, armed (always true), driving (the command being sent, or null),
                annotations, labels, pages}.
            role: context
        -
            method: GET
            path: api/view
            when: 'you need to see what the user sees, or where the robot is'
            description: >-
                What the user sees: the rendered 3D view (with annotation labels) as an image, the 3D camera's pose and
                intrinsics, the latest robot camera image (with a pixel grid) and its CameraInfo and pose, the robot's
                pose, the annotations, and the fixed frame. 503 if no page is open to render it.
            role: view
        -
            method: POST
            path: api/camera
            when: you want to point the user's 3D view at the robot or a place
            description: >-
                Move the 3D camera in every open page: action=recenter (follow the robot again, or reframe it if already
                following), topDown (straight down over the robot), or lookAt (target [x, y, z], optional distance;
                stops following). Returns {ok, pages} (how many pages got it); 400 for an unknown action or lookAt
                without a target.
            params:
                action:
                    description: recenter | topDown | lookAt
                    required: true
                    type: string
                distance:
                    description: 'lookAt: meters from the target'
                    type: number
                target:
                    description: 'lookAt: the point, world frame'
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
        -
            method: GET
            path: api/settings
            when: 'you need the current value of a view, drive or recorder setting'
            description: >-
                Every page setting by key: lv.view {profile (the robot type picked: dog, humanoid, wheeled, arm, drone;
                "" = auto), robot (the type in use, written by the page), fixedFrame ("" = auto), follow, followFrame
                (the TF frame the camera follows; "" = the robot's), showStats, robotModel, camerasIn3d (every camera
                drawn in the 3D view), viewCube (the 3D view's view cube)}; lv.arm {linear, angular, jointSpeed} (arm
                jog speeds); lv.gamepad {deadZone, invertY}; lv.rendering.v2 {pointStyle, cubeShade}; lv.layers.enabled
                {<topic key>: on/off}; lv.layer.<type>.<topic key> (that layer's style: colors, sizes, ...);
                lv.drive.<robot type> {linear, angular, vertical, topics: [] = auto, else the output topics, one per
                entry, "/name" or "/name TwistStamped"}; lv.joy {enabled} (the raw gamepad, drive keys and thumb sticks
                as sensor_msgs/Joy on /joystick, default on); lv.record.topics {<topic key>: record or not (default
                on)}; lv.record.options {recordNew, compression, image_format, directory ("" = default), logs, rates
                {<topic key>: max messages/s}}; lv.cameras (the camera panels). Returns an object of setting key -> its
                value.
        -
            method: PATCH
            path: api/settings
            when: 'you want to change layers, the view, drive speeds or topics'
            description: >-
                Change a page setting (merged into the key's object; a null field is removed); every open page applies
                it at once. E.g. {key: "lv.layers.enabled", value: {"dimos/lidar/sensor_msgs.PointCloud2": false}} hides
                a layer; {key: "lv.view", value: {follow: false}}. Keys: see GET api/settings. Returns {key, value} (the
                key's whole value after the merge); 400 for an unknown key or a value that isn't an object.
            params:
                key:
                    description: 'e.g. lv.view, lv.layers.enabled, lv.layer.pointcloud.<topic key>'
                    required: true
                    type: string
                value:
                    description: the fields to set
                    required: true
                    type: object
        -
            method: GET
            path: api/recorder
            when: 'you want to know if it''s recording, or list the recordings'
            description: >-
                The recorder: whether it's recording (messages, bytes, dropped, skipped by a max rate, seconds, path),
                the keys and log dirs being recorded, the files in the recordings folder, the folder (and the default
                one, and Desktop's shared recordings folder) and its options (lv.record.options). Returns {recording
                {active, path, messages, bytes, dropped, skipped, seconds}, keys, logs {dirs, lines}, files [{name,
                path, bytes, seconds_old}], settings, directory, default_directory, recordings_root, options}.
        -
            method: POST
            path: api/recorder/start
            when: you need to start recording the robot's data to an mcap file
            description: >-
                Start recording to mcap. Without keys: every topic on the bus except the ones turned off in the recorder
                (lv.record.topics), and topics that appear later join (unless recordNew is off); the running dimos's
                jsonl logs go in too (unless logs is off). Each stream is kept to its max rate (rates). Location labels
                are written into it. Returns the recording status {active, path, messages, bytes, dropped, skipped,
                seconds}; 409 with the reason if it can't start (e.g. already recording), 503 if the bus can't be
                reached.
            params:
                keys:
                    description: 'dimos keys to record (dimos/<topic>/<pkg.Type>); default: as above'
                    items:
                        type: string
                    type: array
                name:
                    description: file name (default controller_<time>.mcap)
                    type: string
        -
            method: POST
            path: api/recorder/stop
            when: you want to stop and save the running recording
            description: >-
                Stop the recording and close the file (it shows in Desktop's recordings). Returns the final status
                {active, path, messages, bytes, dropped, skipped, seconds}; 409 if not recording.
        -
            method: POST
            path: api/recorder/add
            when: you want more topics in the recording that's already running
            description: >-
                Add keys to the running recording. Returns {added} (how many of the keys were new); 409 if not
                recording.
            params:
                keys:
                    description: dimos keys to add (dimos/<topic>/<pkg.Type>)
                    items:
                        type: string
                    required: true
                    type: array
        -
            method: POST
            path: api/recorder/logs
            when: you want dimos logs added to the running recording
            description: >-
                Add dimos log dirs to the running recording (each run's log dir, or logs roots whose run dirs are
                followed). Returns {dirs} (the log dirs now recorded); 409 if not recording.
            params:
                log_dirs:
                    description: a run's log dir each; its jsonl logs are tailed into the recording
                    items:
                        type: string
                    type: array
                log_roots:
                    description: logs roots; each run dir in them is followed
                    items:
                        type: string
                    type: array
        -
            method: PUT
            path: api/recorder/settings
            when: 'you want to change the recording format, folder or topic rates'
            description: >-
                Recording options, saved (lv.record.options): image_format (raw | png | jpegxl | webp | jpeg),
                compression (none | lz4 | zstd) and directory ("" = the default) not while recording; recordNew, logs
                and rates (a stream's max messages per second, 0 = every message) any time. Only the fields given
                change. Returns the recorder status (as GET api/recorder); 409 for a format or folder change while
                recording, 400 for a bad value.
            params:
                compression:
                    description: none | lz4 | zstd
                    type: string
                directory:
                    description: where recordings go; "" = the default (Desktop's shared recordings folder)
                    type: string
                image_format:
                    description: raw | png | jpegxl | webp | jpeg
                    type: string
                logs:
                    description: record the running dimos's jsonl logs
                    type: boolean
                rates:
                    description: topic key -> max messages per second (0 or null = every message)
                    type: object
                recordNew:
                    description: topics that appear mid-recording join it
                    type: boolean
        -
            method: GET
            path: api/recorder/streams
            when: you need to know which topics are on the bus and how heavy they are
            description: >-
                Each stream on the bus, biggest first: key, topic, type, bytesPerSecond and messagesPerSecond (measured
                live; the meter listens while this is asked for and stops 15 s after), whether it's recorded, and its
                maxRate. Returns {streams [...], seconds} (seconds = how long the meter has listened).
        -
            method: GET
            path: 'api/recorder/files/{name}'
            when: you want to download a finished recording
            description: >-
                Download a recording from the recordings folder. Returns the file's bytes (application/octet-stream, as
                an attachment); 404 if there is no such file.
            params:
                name:
                    description: 'the file name, as GET api/recorder lists it under files'
                    required: true
                    type: string
        -
            method: DELETE
            path: 'api/recorder/files/{name}'
            when: you want to delete a finished recording
            description: >-
                Delete a recording from the recordings folder (not the running one). Returns {ok, removed}; 409 if it is
                the running recording, 404 if there is no such file.
            params:
                name:
                    description: 'the file name, as GET api/recorder lists it under files'
                    required: true
                    type: string
        -
            method: GET
            path: api/labels
            when: you want the named places pinned on the map
            description: >-
                Location labels pinned in the map (right-click in the 3D view): id, label, frame_id, position,
                orientation, created (ns). Returns {labels [...]}.
        -
            method: POST
            path: api/labels
            when: you want to name a place on the map
            description: >-
                Pin a text label at a point (the viewer's fixed frame, usually world); if a recording is running it is
                written into it on /labels. Returns {label (with its new id), recorded (whether it went into a running
                recording)}; 400 if a field is missing.
            params:
                frame_id:
                    description: 'the frame of position, e.g. world'
                    required: true
                    type: string
                label:
                    description: the text shown at the point
                    required: true
                    type: string
                position:
                    description: '[x, y, z] meters in frame_id'
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    required: true
                    type: array
        -
            method: DELETE
            path: 'api/labels/{id}'
            when: you want to remove a named place from the map
            description: 'Remove a location label. Returns {ok, removed}; 404 if there is no such label.'
            params:
                id:
                    description: 'the label''s id, from GET api/labels'
                    required: true
                    type: string
        -
            method: GET
            path: api/annotations
            when: you want the labeled 3D boxes shown in the view
            description: 'The live annotations (id, label, center, size, yaw, frame, note). Returns {annotations [...]}.'
        -
            method: POST
            path: api/annotations
            when: you want to mark something in the 3D view with a labeled box
            description: >-
                Add a live 3D box annotation with a label; every open page shows it immediately. Returns the annotation
                as stored (with its id); 400 for a bad field.
            params:
                center:
                    description: 'box center [x, y, z], meters in frame'
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                color:
                    description: CSS color
                    type: string
                frame:
                    description: TF frame of center (default world)
                    type: string
                id:
                    description: optional id (default box-<n>); use it to update or delete
                    type: string
                label:
                    description: shown above the box
                    type: string
                note:
                    description: 'a second line under the label, e.g. "1.76 m tall"'
                    type: string
                size:
                    description: 'full extents [dx, dy, dz], meters'
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                yaw:
                    description: radians about +z (default 0)
                    type: number
        -
            method: PATCH
            path: 'api/annotations/{id}'
            when: 'you want to move, resize, relabel or rename a 3D box'
            description: >-
                Change an annotation: label, note, center, size, yaw, color, or newId (to rename it). Only the fields
                given change. Returns the updated annotation; 404 if there is no such id.
            params:
                center:
                    description: new center
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                color:
                    description: CSS color
                    type: string
                id:
                    description: 'the annotation''s id (in the path), from GET api/annotations'
                    required: true
                    type: string
                label:
                    description: new text shown above the box
                    type: string
                newId:
                    description: rename to this id
                    type: string
                note:
                    description: new second line under the label
                    type: string
                size:
                    description: new size
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                yaw:
                    description: 'new rotation, radians about +z'
                    type: number
        -
            method: DELETE
            path: 'api/annotations/{id}'
            when: you want to remove one 3D box from the view
            description: 'Remove an annotation by id. Returns {ok, removed}; 404 if there is no such id.'
            params:
                id:
                    description: 'the annotation''s id, from GET api/annotations'
                    required: true
                    type: string
        -
            method: DELETE
            path: api/annotations
            when: you want to clear every 3D box from the view
            description: 'Remove every annotation. Returns {removed} (how many were removed).'
        -
            method: POST
            path: api/locate
            when: you need an object's 3D position or height from the camera image
            description: >-
                Find an object in 3D from a box around it in the robot camera image (pixel coordinates of the image GET
                api/view returns): uses the lidar points inside that box (else where the box's bottom meets the floor)
                and returns its 3D box and height. add=true also adds it as an annotation. Returns {method (lidar, or
                floor contact), points, depth, height (meters; null if a floor-contact box is cut off at the image top),
                ground, box {center, size, yaw, frame}, note}, or with add=true {located, annotation}; 400 for a bad
                bbox, 422 with the reason if it can't (no page open, no CameraInfo, no TF, ...).
            params:
                add:
                    description: also add the found box as an annotation
                    type: boolean
                bbox:
                    description: '[x1, y1, x2, y2] pixels in the camera image'
                    items:
                        type: number
                    maxItems: 4
                    minItems: 4
                    required: true
                    type: array
                id:
                    description: 'with add=true: the annotation''s id (default box-<n>)'
                    type: string
                label:
                    description: 'with add=true: the annotation''s label'
                    type: string
        -
            method: POST
            path: api/drive/arm
            when: an older script arms driving first (never needed now)
            description: >-
                No-op, kept for older callers: driving needs no arming (always armed). Use api/drive/stop to stop.
                Returns {armed: true, note}.
            params:
                armed:
                    description: ignored
                    type: boolean
                source:
                    description: ignored
                    type: string
        -
            method: POST
            path: api/drive
            when: you need to drive or turn the robot
            description: >-
                Drive the robot: publish a Twist (linear [x, y, z] m/s, angular [x, y, z] rad/s, each within ±5) at 10
                Hz for seconds (default 1, at most 10), then a second of zeros. No arming needed. topic: default the
                drive panel's, else the cmd_vel on the bus. dryRun=true only says what it would send. A new command or a
                stop replaces a running one; every open page shows it. Returns {key, linear, angular, seconds, hz,
                messages (how many it sends), dryRun, source}; 400 for a speed, duration or topic out of range.
            params:
                angular:
                    description: rad/s (z = turn left)
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                dryRun:
                    description: 'send nothing, say what would be sent'
                    type: boolean
                linear:
                    description: 'm/s, robot frame (x forward, y left)'
                    items:
                        type: number
                    maxItems: 3
                    minItems: 3
                    type: array
                seconds:
                    description: 'default 1, at most 10'
                    type: number
                source:
                    description: 'who is driving, shown on the page (default agent)'
                    type: string
                topic:
                    description: e.g. /cmd_vel
                    type: string
        -
            method: POST
            path: api/drive/stop
            when: you need the robot to stop moving
            description: >-
                Stop driving: cancels a running drive command and sends a second of zeros. Returns what it sends, as
                api/drive does (a zero Twist); 400 for a bad topic.
            params:
                dryRun:
                    description: 'send nothing, say what would be sent'
                    type: boolean
                topic:
                    description: default as for api/drive
                    type: string
        -
            method: GET
            path: api/manipulation
            when: 'you need the arm planner''s state, target, groups or last plan'
            description: >-
                The arm's planner (dimos's ManipulationModule): available (false with error when none answers), state
                (operation_status, execution_status, has_pending_plan, groups: {<group>: {joints {name, position},
                end_effector_pose (world), gripper_position, joint_presets {home, init}}}), planning groups (id,
                joint_names, base_frame, tip_frame, has_gripper), the target shown as the ghost arm, and the plan last
                made (id, duration, jointNames, times, positions).
        -
            method: POST
            path: api/manipulation/target
            when: you want to set or clear where the arm should go (moves nothing)
            description: >-
                Set the target every open page shows as the ghost arm (it moves nothing): groups (the planning groups
                selected, default [manipulator]) with joints {name: radians} and/or poses {group: {position [x, y, z],
                orientation [x, y, z, w], frame (default world)}} (or one pose for the first group), source joints |
                cartesian (which was edited); or preset current | init | home (that preset's joints for the groups).
                clear=true removes the target.
            params:
                clear:
                    description: remove the target
                    type: boolean
                groups:
                    description: planning group ids
                    type: array
                joints:
                    description: joint name -> radians
                    type: object
                pose:
                    description: the first group's pose
                    type: object
                poses:
                    description: 'group -> {position, orientation, frame}'
                    type: object
                preset:
                    description: current | init | home
                    type: string
                source:
                    description: joints | cartesian
                    type: string
        -
            method: POST
            path: api/manipulation/plan
            when: you want a collision-checked plan to the arm target
            description: >-
                Plan from where the arm is to the target (the body's, else the current one), collision-checked by the
                ManipulationModule: mode joint (default lv.manip.mode) plans to the groups' joints, mode cartesian a
                straight TCP path to the poses (with the hook; without it plan_to_poses). On success the plan is kept
                for Preview and Execute and every page draws its path. speed: the plan's speed scale 0.05-1 (default
                lv.manip.speed).
            params:
                groups:
                    type: array
                joints:
                    type: object
                mode:
                    description: joint | cartesian
                    type: string
                poses:
                    type: object
                speed:
                    description: 0.05-1
                    type: number
        -
            method: POST
            path: api/manipulation/preview
            when: you want to show the planned arm motion without moving the arm
            description: Play the kept plan on the ghost arm in every open page (the real arm doesn't move).
        -
            method: POST
            path: api/manipulation/execute
            when: you want the arm to run the kept plan
            description: Run the kept plan on the arm.
        -
            method: POST
            path: api/manipulation/cancel
            when: you need the arm's planning or motion stopped
            description: Stop planning or the running trajectory.
        -
            method: POST
            path: api/manipulation/clear
            when: you want the kept arm plan discarded
            description: Discard the kept plan.
        -
            method: GET
            path: api/manipulation/obstacles
            when: you need the arm planner's obstacles
            description: 'The planning scene''s obstacles: name -> pose.'
        -
            method: POST
            path: api/manipulation/evaluate
            when: you want to check an arm target before planning
            description: >-
                Check a target the way viser's panel does, in the planner's process (needs the hook): collision-aware IK
                for poses, collision and limits for joints. Body: a target (groups, joints or poses, source). Answers
                success, collision_free, status (FEASIBLE, COLLISION, NO_SOLUTION, INVALID...), message, joints (the
                IK's for poses), poses (each group's tip for joints).
            params:
                groups:
                    type: array
                joints:
                    type: object
                poses:
                    type: object
                source:
                    description: joints | cartesian
                    type: string
        -
            method: GET
            path: api/manipulation/scene
            when: you need the arm planning scene's shapes and grasp proposals
            description: >-
                What viser draws besides the arm (needs the hook): obstacles with their shapes (box, sphere, cylinder,
                mesh vertices/faces, octree points), grasp proposals (pose, score; best first), the last preview; each
                with a version, left out when ?obstacles=&grasps=&preview= already has it. Without the hook: obstacle
                poses only (type marker).
        -
            method: GET
            path: api/manipulation/description
            when: you need the arm planner's robot model
            description: >-
                The planner's robot model as dimos.robot_description.v1 (links with visual and collision geometry,
                joints, base pose), from the hook.
        -
            method: GET
            path: api/manipulation/hook
            when: you need to know whether the controller's planner hook is loaded or installed
            description: >-
                dim-controller's hook in the blueprint's process: loaded (its info: pid, python, groups, joint topology)
                and installed (per running dimos run's venv).
        -
            method: POST
            path: api/manipulation/hook/install
            when: you want the controller's planner hook installed into the running blueprint
            description: >-
                Install (uninstall=true: remove) the hook into the venv of every running dimos run, or venv; it loads
                when the blueprint restarts.
            params:
                uninstall:
                    description: ''
                    type: boolean
                venv:
                    description: 'a venv or its python (default: every running dimos run''s)'
                    type: string
        -
            method: GET
            path: api/manipulation/poses
            when: you need the arm poses saved for a robot
            description: >-
                The arm poses saved for a robot model (robot: its URDF name), from
                ~/.dimos/app_data/manip_data/<robot>/poses.yaml: poses [{name, color, target}] (target as
                api/manipulation/target takes it; setting it moves nothing).
            params:
                robot:
                    description: 'the URDF''s name, e.g. r1pro'
                    required: true
                    type: string
        -
            method: PUT
            path: api/manipulation/poses
            when: you want to change the arm poses saved for a robot
            description: 'Replace the arm poses saved for a robot model (the whole list, in order); every open page shows them.'
            params:
                poses:
                    description: '[{name, color (CSS, optional), target {groups, joints, poses, source}}]'
                    required: true
                    type: array
                robot:
                    description: the URDF's name
                    required: true
                    type: string
        -
            method: PATCH
            path: api/manipulation/options
            when: you want to change the arm view's planner options
            description: >-
                The arm 3D view's planner options (lv.manip), applied in every open page: mode (joint | cartesian: what
                the gizmo and sliders set), speed (next plan's speed scale 0.05-1), display (visual | collision | both:
                the arm's geometry), obstacles (draw the planning scene's obstacles), grasps (draw the grasp proposals),
                grid (the ground grid), interact (the 3D arm and gizmo are shown).
            params:
                display:
                    description: visual | collision | both
                    type: string
                grasps:
                    description: ''
                    type: boolean
                grid:
                    description: ''
                    type: boolean
                interact:
                    description: ''
                    type: boolean
                mode:
                    description: joint | cartesian
                    type: string
                obstacles:
                    description: ''
                    type: boolean
                speed:
                    description: 0.05-1
                    type: number
